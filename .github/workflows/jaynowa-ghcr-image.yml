# JAYNOWA TEST BUILD: builds the supervised (Unraid) image of this fork for amd64 and
# publishes it to GHCR. Run it by hand from the Actions tab, or it runs on every push to
# the merge branch. Tags: supervised-test (moves with each build) and supervised-<sha>.
name: JayNowa supervised image

on:
  workflow_dispatch:
  push:
    branches: [merge-upstream-3.2.1]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/jaynowa/distracearr
  FORK_REPO: JayNowa/Tracearr
  UPSTREAM_VERSION: 3.2.1

concurrency:
  group: jaynowa-ghcr-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'JayNowa/Tracearr'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve build info
        id: info
        run: |
          echo "short=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Fetch basemap for image
        uses: ./.github/actions/fetch-basemap

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push supervised image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.supervised
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:supervised-test
            ${{ env.IMAGE }}:supervised-${{ steps.info.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.FORK_REPO }}
            org.opencontainers.image.version=${{ env.UPSTREAM_VERSION }}-test-${{ steps.info.outputs.short }}
          build-args: |
            APP_VERSION=${{ env.UPSTREAM_VERSION }}
            APP_UPSTREAM_VERSION=${{ env.UPSTREAM_VERSION }}
            APP_FORK_REVISION=0
            APP_FORK_VERSION=${{ env.UPSTREAM_VERSION }}-test-${{ steps.info.outputs.short }}
            APP_FORK_RELEASE_TAG=v${{ env.UPSTREAM_VERSION }}-test
            APP_FORK_REPO=${{ env.FORK_REPO }}
            APP_IMAGE_REPO=${{ env.IMAGE }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_DATE=${{ steps.info.outputs.build-date }}
            APP_TAG=supervised-test
